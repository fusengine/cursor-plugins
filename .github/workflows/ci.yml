name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Installer (typecheck + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .cursor-plugin/scripts
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test

  integration:
    name: Install flows (sandboxed HOME)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install installer dependencies
        run: bun install --frozen-lockfile
        working-directory: .cursor-plugin/scripts

      # Every suite drives install.sh against a throwaway HOME, so nothing
      # touches the runner's own configuration.
      - name: Shell test suites
        run: |
          set -euo pipefail
          failed=0
          for suite in tests/*.test.sh; do
            echo "::group::$suite"
            if bash "$suite"; then
              echo "PASS $suite"
            else
              echo "::error file=$suite::suite failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Dry run writes nothing under ~/.cursor
        run: |
          set -euo pipefail
          SANDBOX="$(mktemp -d)"
          HOME="$SANDBOX" ./install.sh --dry-run
          if [ -e "$SANDBOX/.cursor" ]; then
            echo "::error::--dry-run created $SANDBOX/.cursor"
            find "$SANDBOX/.cursor" | head -20
            exit 1
          fi
          echo "PASS: dry-run left ~/.cursor untouched"

      - name: Real install deploys every plugin
        run: |
          set -euo pipefail
          SANDBOX="$(mktemp -d)"
          HOME="$SANDBOX" ./install.sh --skip-env < /dev/null
          expected=$(node -e "console.log(require('./.cursor-plugin/marketplace.json').plugins.length)")
          actual=$(ls -1 "$SANDBOX/.cursor/plugins/local" | wc -l | tr -d ' ')
          echo "plugins: $actual / $expected"
          [ "$actual" = "$expected" ] || { echo "::error::plugin count mismatch"; exit 1; }
          test -f "$SANDBOX/.cursor/rules/fuse-global.mdc" || { echo "::error::global user rule missing"; exit 1; }
          test -f "$SANDBOX/.cursor/.fusengine-global/receipt.json" || { echo "::error::receipt missing"; exit 1; }
          # The deployed loader must start from its destination, with its src/ tree.
          HOME="$SANDBOX" bun "$SANDBOX/.cursor/.fusengine-global/scripts/hooks-loader.ts" sessionStart < /dev/null
          echo "PASS: install deployed $actual plugins, rule, receipt and a runnable loader"

  plugins:
    name: Plugin manifests and hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every plugin.json and hooks.json parses
        run: |
          set -euo pipefail
          for f in .cursor-plugin/marketplace.json \
                   .cursor-plugin/plugins/*/.cursor-plugin/plugin.json \
                   .cursor-plugin/plugins/*/hooks/hooks.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              || { echo "::error file=$f::invalid JSON"; exit 1; }
          done
          echo "PASS: all manifests parse"

      - name: Hook commands stay relative, wrappers executable
        run: |
          set -euo pipefail
          if grep -rn 'npx -y @fusengine/harness\|bun \$HOME' .cursor-plugin/plugins/*/hooks/hooks.json; then
            echo "::error::hook commands must call ./scripts/hook.sh (relative), per the Cursor submission checklist"
            exit 1
          fi
          for w in .cursor-plugin/plugins/*/scripts/hook.sh; do
            sh -n "$w" || { echo "::error file=$w::syntax error"; exit 1; }
            test -x "$w" || { echo "::error file=$w::not executable"; exit 1; }
          done
          echo "PASS: $(ls -1 .cursor-plugin/plugins/*/scripts/hook.sh | wc -l | tr -d ' ') wrappers valid"

      - name: Entry points resolve
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n verify.sh
          bash -n verify-project.sh
          for target in .cursor-plugin/scripts/install-hooks.ts \
                        .cursor-plugin/scripts/hooks-loader.ts \
                        .cursor-plugin/scripts/verify.ts \
                        .cursor-plugin/scripts/src/services/global-install.ts \
                        .cursor-plugin/scripts/src/services/project-install.ts; do
            test -f "$target" || { echo "::error::dead entry point: $target"; exit 1; }
          done
          echo "PASS: shell entry points valid, every target exists"
